name: English Radar

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Install libraries
        run: |
          pip install gTTS requests pydub
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run English Radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py
